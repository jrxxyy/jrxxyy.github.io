<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTC Trig + L∞ Chat — Alpha Wiki</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;overflow:hidden;font-family:system-ui,sans-serif;color:#e0e7ff}
.stage{display:flex;align-items:center;gap:1.6rem;z-index:10}
#zz-image{position:absolute;left:6%;top:50%;transform:translateY(-50%);max-width:200px;max-height:32vh;z-index:12;opacity:.88;filter:drop-shadow(0 0 18px rgba(99,102,241,.25))}
#zz-image.active{opacity:.72}
#wave-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.45;width:100%;height:100%;display:block}
.spin-cube{position:fixed;top:12px;width:150px;height:150px;perspective:700px;z-index:40;pointer-events:none}
#corner-cube{left:12px}
#helix-container{right:12px}
.spin-cube .cube{width:150px;height:150px;transform-style:preserve-3d;animation:spinCube 8s linear infinite}
#helix-container .cube{animation-direction:reverse}
@keyframes spinCube{from{transform:rotateX(-18deg) rotateY(0)}to{transform:rotateX(-18deg) rotateY(360deg)}}
.spin-cube .face{position:absolute;width:114px;height:114px;left:18px;top:18px;background:rgba(15,15,35,.85);border:1px solid rgba(99,102,241,.55);overflow:hidden}
.spin-cube .front{transform:translateZ(57px)}
.spin-cube .back{transform:rotateY(180deg) translateZ(57px)}
.spin-cube .right{transform:rotateY(90deg) translateZ(57px)}
.spin-cube .left{transform:rotateY(-90deg) translateZ(57px)}
.spin-cube .top{transform:rotateX(90deg) translateZ(57px)}
.spin-cube .bottom{transform:rotateX(-90deg) translateZ(57px)}
.spin-cube .calc-face,.spin-cube .calc-face img,.spin-cube .calc-face canvas{width:100%;height:100%}
.spin-cube .calc-face{position:relative}
.spin-cube .calc-face canvas{position:absolute;inset:0;pointer-events:none}
.spin-cube .cube-overlay{position:absolute;inset:0;opacity:.18;mix-blend-mode:screen;pointer-events:none}
#helix-canvas{width:100%;height:100%;display:block}
#dock{width:340px;display:flex;flex-direction:column;gap:8px;z-index:16}
#cone-box{height:88px;border:1px solid rgba(99,102,241,.4);border-radius:10px;background:rgba(10,10,20,.75);overflow:hidden}
#chat{height:320px;display:flex;flex-direction:column;background:rgba(15,15,35,.92);border:1px solid rgba(99,102,241,.4);border-radius:10px;font-size:11px}
#chat-log{flex:1;overflow:auto;padding:8px;line-height:1.45}
#chat-log .u{color:#a5b4fc}
#chat-log .s{color:#22d3ee}
#chat-log .apx{color:#94a3b8;font-style:italic}
#chat-log .ret{color:#86efac;white-space:pre-wrap}
#chat-log .alpha{color:#fde68a;white-space:pre-wrap;border-left:2px solid #f59e0b;padding-left:8px;margin:6px 0}
#chat-log .alpha a{color:#93c5fd}
#chat-log .wait{color:#c4b5fd}
.keys{display:flex;gap:4px;padding:0 8px 6px}
.keys b{flex:1;text-align:center;background:#1e1b4b;border-radius:4px;padding:3px 0;cursor:pointer;color:#c7d2fe}
#ai-feedback{padding:8px;border-top:1px solid rgba(99,102,241,.25)}
#ai-feedback .hint{color:#a5b4fc;margin-bottom:2px}
#ai-feedback input,#ai-feedback button{width:100%;padding:6px;border-radius:6px;font-size:12px;margin-top:4px}
#ai-feedback input{background:#0f0f1a;border:1px solid #4338ca;color:#e0e7ff}
#ai-feedback button{background:#4f46e5;border:0;color:#fff;cursor:pointer}
#time-panel{position:fixed;bottom:1.2rem;left:1.2rem;background:rgba(15,15,25,.85);border:1px solid rgba(99,102,241,.3);border-radius:12px;padding:.8rem 1rem;font-size:12px;z-index:20}
#time-panel .label{color:#a5b4fc;margin-right:.35rem}
#micro-alert{position:fixed;top:178px;right:12px;background:rgba(0,0,0,.78);padding:.5rem .7rem;border-radius:8px;font-size:12px;opacity:0;transform:translateY(-8px);transition:.25s;z-index:30;pointer-events:none}
#micro-alert.visible{opacity:1;transform:none}
</style>
</head>
<body>
<canvas id="wave-canvas"></canvas>
<img id="zz-image" src="zz.png" alt="zz">
<div id="helix-container" class="spin-cube">
  <div class="cube">
    <div class="face front" id="helix-face-front"></div>
    <div class="face back"></div>
    <div class="face right" id="helix-face-right"></div>
    <div class="face left"></div>
    <div class="face top"></div>
    <div class="face bottom"></div>
  </div>
  <img src="abcc.png" class="cube-overlay" alt="">
</div>
<div id="corner-cube" class="spin-cube">
  <div class="cube">
    <div class="face front" id="face-front"></div>
    <div class="face back"></div>
    <div class="face right" id="face-right"></div>
    <div class="face left"></div>
    <div class="face top"></div>
    <div class="face bottom"></div>
  </div>
  <img src="abcc.png" class="cube-overlay" alt="">
</div>
<div class="stage">
  <div id="dock">
    <canvas id="cone-box" width="340" height="88"></canvas>
    <div id="chat">
      <div id="chat-log"></div>
      <div class="keys">
        <b data-k="q">Q</b><b data-k="a">A</b><b data-k="z">Z</b><b data-k="s">S</b><b data-k="d">D</b>
      </div>
      <div id="ai-feedback">
        <div class="hint">prompt → κ == qz == qy · 4 words = alpha wiki in-box first</div>
        <input id="feedback-input" placeholder="type four words → top cite before Wikipedia" maxlength="120">
        <button type="button" id="feedback-btn">Feed →</button>
      </div>
    </div>
  </div>
</div>
<div id="time-panel">
  <div><span class="label">UTC</span><span id="utc-time">--:--:--</span></div>
  <div><span class="label">Angle</span><span id="utc-angle">0.0°</span></div>
  <div><span class="label">sin</span><span id="utc-sin">0.000</span></div>
  <div><span class="label">cos</span><span id="utc-cos">1.000</span></div>
  <div><span class="label">tan</span><span id="utc-tan">0.000</span></div>
  <div><span class="label">‖v‖∞</span><span id="utc-linf">0.000</span></div>
</div>
<div id="micro-alert">
  <div><b>Angle:</b> <span id="ma-angle">0°</span></div>
  <div><b>Cosine:</b> <span id="ma-cos">1.000</span></div>
  <div><b>Distance:</b> <span id="ma-dist">0 px</span></div>
</div>
<script>
const EPS = 1e-8;
const INFO_LOG = [];
window.curvature3D = function(r1, r2, o = {}) {
  const x1 = r1.x || 0;
  const y1 = o.y !== undefined ? o.y : (r1.y || 0);
  const z1 = r1.z || 0;
  const x2 = r2.x || 0, y2 = r2.y || 0, z2 = r2.z || 0;
  const cross = Math.hypot(y1 * z2 - z1 * y2, z1 * x2 - x1 * z2, x1 * y2 - y1 * x2);
  const speed = Math.hypot(x1, y1, z1);
  return speed < EPS ? 0 : cross / (speed ** 3);
};
function eq(a, b) { return Math.abs(a - b) < EPS; }
function promptVector(text) {
  const words = String(text).trim().split(/\s+/).filter(Boolean);
  let qy = 0, qz = 0;
  for (let i = 0; i < words.length; i++) {
    const L = words[i].length;
    qy += L * Math.sin(i + 1);
    qz += L * Math.cos(i + 1);
  }
  return { qx: words.length, qy, qz, words };
}
function promptCurvature(q) {
  const r1 = { x: 0.012, y: q.qy * 0.012, z: q.qz * 0.004 };
  const r2 = { x: 0, y: -q.qy * 0.012 * 0.012, z: -q.qz * 0.004 * 0.004 };
  return window.curvature3D(r1, r2, { y: r1.y });
}
function buildInfoReturn(prompt, source) {
  const q = promptVector(prompt);
  const kappa = promptCurvature(q);
  const rec = {
    type: "info-return",
    ts: new Date().toISOString(),
    source,
    prompt,
    words: q.words,
    q: { qx: q.qx, qy: q.qy, qz: q.qz },
    curvature: kappa,
    identity: "curvature == qz == qy",
    equal: {
      qz_eq_qy: eq(q.qz, q.qy),
      kappa_eq_qz: eq(kappa, q.qz),
      kappa_eq_qy: eq(kappa, q.qy),
      chain: eq(kappa, q.qz) && eq(q.qz, q.qy)
    },
    residual: {
      qz_minus_qy: q.qz - q.qy,
      kappa_minus_qz: kappa - q.qz,
      kappa_minus_qy: kappa - q.qy
    },
    wiki: null
  };
  INFO_LOG.push(rec);
  window.INFO_LOG = INFO_LOG;
  return rec;
}
function fmtN(v) { return Number(v).toFixed(6); }
function formatReturn(rec) {
  return [
    "info-return  (β calculus packet)",
    "identity: κ == qz == qy",
    "κ     = " + fmtN(rec.curvature),
    "qy    = " + fmtN(rec.q.qy),
    "qz    = " + fmtN(rec.q.qz),
    "qx    = " + rec.q.qx,
    "qz==qy: " + rec.equal.qz_eq_qy,
    "κ==qz : " + rec.equal.kappa_eq_qz,
    "κ==qy : " + rec.equal.kappa_eq_qy,
    "chain : " + rec.equal.chain,
    "Δ(qz-qy) = " + fmtN(rec.residual.qz_minus_qy)
  ].join("\n");
}
const LIMITS = {
  q: "Q axis: query length → qx",
  a: "A axis: answer samples qy, qz from word lengths",
  z: "Z axis: compare qz to qy",
  s: "S axis: supremum later binds search hits to this record",
  d: "D axis: discrete packet; log row is one search seed"
};
const logEl = document.getElementById("chat-log");
function line(cls, t) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = t;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}
function lineHTML(cls, html) {
  const d = document.createElement("div");
  d.className = cls;
  d.innerHTML = html;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}
function emitReturn(prompt, source) {
  line("u", "you · " + prompt);
  const rec = buildInfoReturn(prompt, source);
  line("s", "aid · curvature == qz == qy");
  line("ret", formatReturn(rec));
  line("apx", "appendix · log[" + (INFO_LOG.length - 1) + "] stored for auto search return");
  return rec;
}

async function wikiAlpha(query) {
  const searchUrl = "https://en.wikipedia.org/w/api.php?" + new URLSearchParams({
    action: "query",
    list: "search",
    srsearch: query,
    srlimit: "1",
    format: "json",
    origin: "*"
  });
  const search = await fetch(searchUrl).then(r => {
    if (!r.ok) throw new Error("search " + r.status);
    return r.json();
  });
  const hit = search && search.query && search.query.search && search.query.search[0];
  if (!hit) return { empty: true, query };
  const title = hit.title;
  const snippet = String(hit.snippet || "").replace(/<[^>]+>/g, "").replace(/&quot;/g, '"').replace(/&amp;/g, "&");
  let extract = snippet;
  let pageUrl = "https://en.wikipedia.org/wiki/" + encodeURIComponent(title.replace(/ /g, "_"));
  let thumb = "";
  try {
    const sumUrl = "https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title);
    const sum = await fetch(sumUrl).then(r => r.json());
    if (sum && sum.extract) extract = sum.extract;
    if (sum && sum.content_urls && sum.content_urls.desktop) pageUrl = sum.content_urls.desktop.page;
    if (sum && sum.thumbnail && sum.thumbnail.source) thumb = sum.thumbnail.source;
  } catch (e) { /* keep snippet */ }
  return { empty: false, title, snippet, extract, pageUrl, thumb, query, wordcount: hit.wordcount };
}

function formatAlpha(w) {
  if (w.empty) {
    return "α-response · no Wikipedia hit for \"" + w.query + "\"\n(page not opened)";
  }
  const body = (w.extract || w.snippet || "").slice(0, 520);
  return (
    "α-response · BEFORE Wikipedia\n" +
    "top cited: " + w.title + "\n" +
    body +
    (body.length >= 520 ? "…" : "")
  );
}

document.querySelectorAll(".keys b").forEach(b => {
  b.onclick = () => emitReturn(LIMITS[b.dataset.k], "key:" + b.dataset.k);
});
addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (LIMITS[k]) emitReturn(LIMITS[k], "key:" + k);
});
function makeCalc() {
  const wrap = document.createElement("div"); wrap.className = "calc-face";
  const img = document.createElement("img"); img.src = "cal.png";
  const c = document.createElement("canvas"); c.width = c.height = 260;
  wrap.append(img, c); return { wrap, c };
}
const front = makeCalc(), right = makeCalc();
document.getElementById("face-front").appendChild(front.wrap);
document.getElementById("face-right").appendChild(right.wrap);
function makeHelixFace() {
  const wrap = document.createElement("div"); wrap.className = "calc-face";
  const c = document.createElement("canvas"); c.width = 260; c.height = 260;
  wrap.append(c); return { wrap, c };
}
const helixFront = makeHelixFace(), helixRight = makeHelixFace();
document.getElementById("helix-face-front").appendChild(helixFront.wrap);
document.getElementById("helix-face-right").appendChild(helixRight.wrap);
function paint(c, main, sub) {
  const x = c.getContext("2d"), w = c.width, h = c.height;
  x.clearRect(0, 0, w, h);
  const dx = w * .12, dy = h * .1, dw = w * .76, dh = h * .28;
  x.fillStyle = "rgba(8,10,24,.72)"; x.fillRect(dx, dy, dw, dh);
  x.textAlign = "right"; x.textBaseline = "middle";
  x.fillStyle = "#22d3ee"; x.font = "bold 22px ui-monospace,monospace";
  x.fillText(main, dx + dw - 10, dy + dh * .4);
  x.fillStyle = "#a5b4fc"; x.font = "11px ui-monospace,monospace";
  x.fillText(sub, dx + dw - 10, dy + dh * .76);
}
const cone = document.getElementById("cone-box"), cc = cone.getContext("2d");
function drawCone(phase) {
  const w = cone.width, h = cone.height;
  cc.clearRect(0, 0, w, h);
  const ox = 28, oy = h / 2, tipX = w - 22, tipY = h / 2 + Math.sin(phase) * 6;
  cc.strokeStyle = "rgba(165,180,252,.45)";
  cc.beginPath(); cc.moveTo(8, oy); cc.lineTo(tipX, tipY); cc.stroke();
  cc.fillStyle = "rgba(34,211,238,.18)"; cc.strokeStyle = "#22d3ee";
  cc.beginPath();
  cc.moveTo(tipX, tipY);
  cc.lineTo(ox, oy - 22 - Math.cos(phase) * 4);
  cc.quadraticCurveTo(ox - 8, oy, ox, oy + 22 + Math.cos(phase) * 4);
  cc.closePath(); cc.fill(); cc.stroke();
  cc.fillStyle = "#a5b4fc"; cc.font = "10px monospace";
  cc.fillText("κ == qz == qy  ·  α wiki @ 4 words", 70, 14);
}
function paintHelixOn(c, phase) {
  const x = c.getContext("2d"), w = c.width, h = c.height;
  x.fillStyle = "rgba(10,10,20,.92)"; x.fillRect(0, 0, w, h);
  const s = 48, cx = w / 2, cy = h / 2 + 10;
  x.strokeStyle = "rgba(165,180,252,.45)";
  x.beginPath(); x.moveTo(cx - 90, cy); x.lineTo(cx + 90, cy); x.moveTo(cx, cy + 70); x.lineTo(cx, cy - 80); x.stroke();
  x.strokeStyle = "#22d3ee"; x.lineWidth = 3; x.beginPath();
  const off = phase || 0;
  for (let t = 1; t <= 6; t += .04) {
    const px = cx + Math.cos(t + off) * s + t * 10, py = cy - Math.sin(t + off) * s - t * 8;
    t === 1 ? x.moveTo(px, py) : x.lineTo(px, py);
  }
  x.stroke();
  x.fillStyle = "#a5b4fc"; x.font = "13px ui-monospace,monospace";
  x.fillText("helix κ", 16, 22);
}
function drawHelix(phase) {
  paintHelixOn(helixFront.c, phase);
  paintHelixOn(helixRight.c, (phase || 0) + 1.2);
}
function knockWhite(img) {
  return new Promise(res => {
    const t = new Image(); t.crossOrigin = "anonymous"; t.src = img.src;
    t.onload = () => { try {
      const c = document.createElement("canvas"), x = c.getContext("2d");
      c.width = t.naturalWidth; c.height = t.naturalHeight; x.drawImage(t, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
      for (let i = 0; i < p.length; i += 4) if (p[i] > 240 && p[i + 1] > 240 && p[i + 2] > 240) p[i + 3] = 0;
      x.putImageData(d, 0, 0); img.src = c.toDataURL("image/png");
    } catch (e) {} res(); };
    t.onerror = res;
  });
}

window.runAIFeedback = async function() {
  const input = document.getElementById("feedback-input");
  const prompt = input.value.trim();
  if (!prompt) {
    line("s", "aid · empty prompt; no info-return");
    return;
  }
  const rec = emitReturn(prompt, "input");
  if (rec.words.length === 4) {
    line("wait", "aid · α-model · four-word packet → citing Wikipedia before any page open…");
    try {
      const w = await wikiAlpha(prompt);
      rec.wiki = w;
      const html = w.empty
        ? formatAlpha(w)
        : ("α-response · BEFORE entering Wikipedia\n" +
           "<b>top cited:</b> " + w.title.replace(/</g, "&lt;") + "\n" +
           (w.extract || w.snippet || "").slice(0, 520).replace(/</g, "&lt;") +
           ((w.extract || "").length > 520 ? "…" : "") +
           "\n<a href=\"" + w.pageUrl + "\" target=\"_blank\" rel=\"noopener\">open cited page →</a>");
      lineHTML("alpha", html);
      line("apx", "appendix · α packet bound to log[" + (INFO_LOG.length - 1) + "]; wiki tab after cite");
      if (!w.empty) {
        window.open(w.pageUrl, "_blank", "noopener");
      }
    } catch (err) {
      line("alpha", "α-response · cite failed: " + (err && err.message ? err.message : err) +
        "\nfallback search tab only");
      window.open("https://en.wikipedia.org/wiki/Special:Search?search=" + encodeURIComponent(prompt) + "&go=Go", "_blank", "noopener");
    }
  }
  input.value = "";
  input.focus();
};
document.getElementById("feedback-btn").onclick = runAIFeedback;
document.getElementById("feedback-input").onkeydown = e => { if (e.key === "Enter") runAIFeedback(); };

const canvas = document.getElementById("wave-canvas"), ctx = canvas.getContext("2d"), img = document.getElementById("zz-image");
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener("resize", resize); resize();
const fmt = (v, d = 3) => Number(v).toFixed(d);
function drawWaves(phase) {
  const w = canvas.width, h = canvas.height; ctx.clearRect(0, 0, w, h);
  [[Math.sin, "167,139,250"], [Math.cos, "34,211,238"]].forEach(([fn, col]) => {
    let px = 0, py = h / 2 + fn(phase) * 80;
    for (let x = 1; x < w; x++) {
      const t = x * .012 + phase, y = h / 2 + fn(t) * 80;
      const r1 = { x: .012, y: (fn === Math.sin ? Math.cos(t) : -Math.sin(t)) * 80 * .012, z: .004 };
      const r2 = { x: 0, y: -fn(t) * 80 * .012 * .012, z: 0 };
      const k = curvature3D(r1, r2, { y: r1.y });
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y);
      ctx.strokeStyle = `rgba(${col},${.35 + Math.min(k * 45, .55)})`;
      ctx.lineWidth = 1.8 + Math.min(k * 14, 2.8); ctx.stroke();
      px = x; py = y;
    }
  });
}
function updateUTC() {
  const now = new Date();
  const sec = now.getUTCSeconds() + now.getUTCMilliseconds() / 1000;
  const deg = sec / 60 * 360, rad = deg * Math.PI / 180;
  const s = Math.sin(rad), c = Math.cos(rad), t = Math.tan(rad);
  const tanStr = Math.abs(t) > 100 ? "∞" : fmt(t);
  const linf = Math.max(Math.abs(s), Math.abs(c), Math.min(Math.abs(t), 99));
  document.getElementById("utc-time").textContent =
    String(now.getUTCHours()).padStart(2, "0") + ":" +
    String(now.getUTCMinutes()).padStart(2, "0") + ":" +
    String(now.getUTCSeconds()).padStart(2, "0");
  document.getElementById("utc-angle").textContent = deg.toFixed(1) + "°";
  document.getElementById("utc-sin").textContent = fmt(s);
  document.getElementById("utc-cos").textContent = fmt(c);
  document.getElementById("utc-tan").textContent = tanStr;
  document.getElementById("utc-linf").textContent = fmt(linf);
  paint(front.c, deg.toFixed(1) + "°", "sin " + fmt(s) + "  cos " + fmt(c));
  paint(right.c, s.toFixed(4), "‖·‖∞ " + fmt(linf));
  img.style.transform = `translateY(-50%) rotate(${s * 6}deg) scale(${1 + c * .08})`;
  drawWaves(rad); drawCone(rad); drawHelix(rad);
  requestAnimationFrame(updateUTC);
}
knockWhite(img).then(() => { drawHelix(); updateUTC(); });
addEventListener("mousemove", e => {
  const left = e.clientX < innerWidth / 2, dx = e.clientX - innerWidth / 2, dy = e.clientY - innerHeight / 2;
  document.getElementById("ma-angle").textContent = Math.round(Math.atan2(dy, dx) * 180 / Math.PI) + "°";
  document.getElementById("ma-cos").textContent = fmt(Math.cos(Math.atan2(dy, dx)));
  document.getElementById("ma-dist").textContent = Math.round(Math.hypot(dx, dy)) + " px";
  img.classList.toggle("active", left);
  document.getElementById("micro-alert").classList.toggle("visible", left);
});
addEventListener("mouseleave", () => {
  img.classList.remove("active");
  document.getElementById("micro-alert").classList.remove("visible");
});
line("s", "aid · every prompt returns κ == qz == qy (β calculus)");
line("apx", "appendix · type exactly four words → α cite appears in this box before Wikipedia opens");
line("apx", "appendix · window.INFO_LOG holds packets; rec.wiki is the alpha hit");
</script>
</body>
</html>
