<!DOCTYPE html>
<html>
<head>
    <title>Calling Functions</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #zz-image {
            max-width: 90%;
            max-height: 90vh;
            transition: transform 0.35s ease, opacity 0.35s ease;
            cursor: pointer;
        }

        #zz-image.active {
            transform: scale(1.35);
            opacity: 0.75;
        }
    </style>
</head>
<body>
    <img id="zz-image" src="zz.png" alt="zz.png">

<script>
    // Declare the pointer on page load
    // Math.cos(0 * Math.PI / 180) returns 1
    const pointer = Math.cos(0 * Math.PI / 180);

    // Global parent function
    window.parentMouseHandler = function(event) {
        const img = document.getElementById('zz-image');
        if (!img) return;

        // Only activate on the left side of the page
        // and only if the pointer is truthy (which it is, since it equals 1)
        const isLeftSide = event.clientX < (window.innerWidth / 2);

        if (isLeftSide && pointer) {
            img.classList.add('active');
        } else {
            img.classList.remove('active');
        }
    };

    window.parentMouseLeave = function() {
        const img = document.getElementById('zz-image');
        if (img) img.classList.remove('active');
    };

    // Attach the global handler
    document.addEventListener('mousemove', window.parentMouseHandler);
    document.addEventListener('mouseleave', window.parentMouseLeave);
</script>
</body>
</html>
