<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calling Functions • UTC Trig</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            color: #e0e7ff;
        }

        #zz-image {
            max-width: 55%;
            max-height: 55vh;
            transition: transform 0.35s ease, opacity 0.35s ease;
            cursor: pointer;
            z-index: 10;
            will-change: transform;
            filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.35));
        }

        #zz-image.active {
            opacity: 0.82;
        }

        /* Canvas for the waves */
        #wave-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.55;
        }

        /* UTC + Trig info panel */
        #time-panel {
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            font-size: 13px;
            line-height: 1.5;
            z-index: 20;
            min-width: 220px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        #time-panel .label {
            color: #a5b4fc;
            font-weight: 600;
            display: inline-block;
            width: 70px;
        }

        #time-panel .value {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        /* Micro-alert (mouse) */
        #micro-alert {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            padding: 0.55rem 0.75rem;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.35;
            transform: translateY(-10px);
            opacity: 0;
            transition: transform 0.25s ease, opacity 0.25s ease;
            pointer-events: none;
            min-width: 11rem;
            z-index: 30;
            backdrop-filter: blur(8px);
        }

        #micro-alert.visible {
            transform: translateY(0);
            opacity: 1;
        }

        #micro-alert b {
            display: inline-block;
            width: 5.4rem;
            font-weight: 600;
            color: #a5b4fc;
        }
    </style>
</head>
<body>
    <canvas id="wave-canvas"></canvas>

    <img id="zz-image" src="zz.png" alt="zz.png">

    <div id="time-panel">
        <div><span class="label">UTC</span> <span class="value" id="utc-time">--:--:--</span></div>
        <div><span class="label">Angle</span> <span class="value" id="utc-angle">0.0°</span></div>
        <div><span class="label">sin</span> <span class="value" id="utc-sin">0.000</span></div>
        <div><span class="label">cos</span> <span class="value" id="utc-cos">1.000</span></div>
        <div><span class="label">tan</span> <span class="value" id="utc-tan">0.000</span></div>
    </div>

    <div id="micro-alert" aria-hidden="true">
        <div><b>Angle:</b> <span id="ma-angle">0°</span></div>
        <div><b>Cosine:</b> <span id="ma-cos">1.000</span></div>
        <div><b>Distance:</b> <span id="ma-dist">0 px</span></div>
    </div>

<script>
    // ========== GLOBAL 3D CURVATURE FUNCTION ==========
    // 3D version of: k = (x'y'' - y'x'') / (x'² + y'²)^{3/2}
    // Only the "y" component is moveable / adjustable
    window.curvature3D = function(r1, r2, options = {}) {
        const x1 = r1.x || 0;
        const y1 = (options.y !== undefined) ? options.y : (r1.y || 0); // ← only y is adjustable
        const z1 = r1.z || 0;

        const x2 = r2.x || 0;
        const y2 = r2.y || 0;
        const z2 = r2.z || 0;

        // Cross product r' × r''
        const cx = y1 * z2 - z1 * y2;
        const cy = z1 * x2 - x1 * z2;
        const cz = x1 * y2 - y1 * x2;

        const crossMag = Math.hypot(cx, cy, cz);
        const speed = Math.hypot(x1, y1, z1);

        if (speed < 1e-8) return 0;
        return crossMag / (speed ** 3);
    };

    // ========== UTC TRIG VISUALIZATION ==========
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');
    const img = document.getElementById('zz-image');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function fmt(v, d = 3) {
        return Number(v).toFixed(d);
    }

    function updateUTC() {
        const now = new Date();
        const h = String(now.getUTCHours()).padStart(2, '0');
        const m = String(now.getUTCMinutes()).padStart(2, '0');
        const s = String(now.getUTCSeconds()).padStart(2, '0');
        const ms = now.getUTCMilliseconds();

        const totalSeconds = now.getUTCSeconds() + ms / 1000;
        const angleDeg = (totalSeconds / 60) * 360;
        const angleRad = angleDeg * Math.PI / 180;

        const sin = Math.sin(angleRad);
        const cos = Math.cos(angleRad);
        const tan = Math.tan(angleRad);

        document.getElementById('utc-time').textContent = `${h}:${m}:${s}`;
        document.getElementById('utc-angle').textContent = angleDeg.toFixed(1) + '°';
        document.getElementById('utc-sin').textContent = fmt(sin);
        document.getElementById('utc-cos').textContent = fmt(cos);
        document.getElementById('utc-tan').textContent = Math.abs(tan) > 100 ? '∞' : fmt(tan);

        // Gentle image animation driven by UTC
        const pulse = 1 + cos * 0.08;
        const rot = sin * 6;
        img.style.transform = `rotate(${rot}deg) scale(${pulse})`;

        drawWaves(angleRad);
        requestAnimationFrame(updateUTC);
    }

    function drawWaves(phase) {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        // ===== Sine wave (purple) with 3D curvature =====
        ctx.beginPath();
        for (let x = 0; x < w; x++) {
            const t = x * 0.012 + phase;
            const y = h/2 + Math.sin(t) * 80;

            // First & second derivatives
            const r1 = {
                x: 0.012,
                y: Math.cos(t) * 80 * 0.012,
                z: 0.004
            };
            const r2 = {
                x: 0,
                y: -Math.sin(t) * 80 * 0.012 * 0.012,
                z: 0
            };

            // Only y is moveable/adjustable
            const k = window.curvature3D(r1, r2, { y: r1.y });

            const alpha = 0.35 + Math.min(k * 45, 0.55);
            ctx.strokeStyle = `rgba(167, 139, 250, ${alpha})`;
            ctx.lineWidth = 1.8 + Math.min(k * 14, 2.8);

            x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();

        // ===== Cosine wave (cyan) with 3D curvature =====
        ctx.beginPath();
        for (let x = 0; x < w; x++) {
            const t = x * 0.012 + phase;
            const y = h/2 + Math.cos(t) * 80;

            const r1 = {
                x: 0.012,
                y: -Math.sin(t) * 80 * 0.012,
                z: 0.004
            };
            const r2 = {
                x: 0,
                y: -Math.cos(t) * 80 * 0.012 * 0.012,
                z: 0
            };

            // Only y is moveable/adjustable
            const k = window.curvature3D(r1, r2, { y: r1.y });

            const alpha = 0.35 + Math.min(k * 45, 0.55);
            ctx.strokeStyle = `rgba(34, 211, 238, ${alpha})`;
            ctx.lineWidth = 1.8 + Math.min(k * 14, 2.8);

            x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Center line
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        ctx.moveTo(0, h/2);
        ctx.lineTo(w, h/2);
        ctx.stroke();
    }

    // Start the animation
    updateUTC();

    // ========== MOUSE HANDLER ==========
    const pointer = Math.cos(0 * Math.PI / 180);

    window.parentMouseHandler = function(event) {
        const alertEl = document.getElementById('micro-alert');
        const isLeftSide = event.clientX < (window.innerWidth / 2);

        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const dx = event.clientX - cx;
        const dy = event.clientY - cy;
        const dist = Math.hypot(dx, dy);
        const angleRad = Math.atan2(dy, dx);
        const angleDeg = angleRad * 180 / Math.PI;
        const cosVal = Math.cos(angleRad);

        if (alertEl) {
            document.getElementById('ma-angle').textContent = Math.round(angleDeg) + '°';
            document.getElementById('ma-cos').textContent = fmt(cosVal, 3);
            document.getElementById('ma-dist').textContent = Math.round(dist) + ' px';
        }

        if (isLeftSide && pointer) {
            img.classList.add('active');
            if (alertEl) alertEl.classList.add('visible');
        } else {
            img.classList.remove('active');
            if (alertEl) alertEl.classList.remove('visible');
        }
    };

    window.parentMouseLeave = function() {
        img.classList.remove('active');
        document.getElementById('micro-alert').classList.remove('visible');
    };

    document.addEventListener('mousemove', window.parentMouseHandler);
    document.addEventListener('mouseleave', window.parentMouseLeave);
</script>
</body>
</html>
