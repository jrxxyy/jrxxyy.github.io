<!DOCTYPE html>
<html>
<head>
    <title>Firefox Search Engine</title>
</head>
<body>

<h2>Firefox Search Engine</h2>
<div id="caution"></div>

<script>
    // Automatically show caution message on load
    document.addEventListener("DOMContentLoaded", () => {
        const caution = document.getElementById("caution");
        caution.textContent = "CAUTION: avoid squares";
    });
</script>

</body>
</html>
