<!DOCTYPE html>
<html>
<head>
    <title>Firefox Search Engine</title>
</head>
<body>

<h2>Firefox Search Engine</h2>
<div id="caution"></div>

<script>
    // Automatically show caution message on load
document.addEventListener("click", (e) => {
    if (e.target.matches("[data-action='go-search']")) {
        window.location.href = "https://www.mozilla.org/en-US/search/?q=avoid+squares";
    }
});
</script>

</body>
</html>
