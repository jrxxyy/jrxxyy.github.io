<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.JR.</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            flex-direction: column;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -1;
            filter: brightness(1.2);
            transform: scale(1.1);
        }

        .main-container {
            display: flex;
            align-items: center;
            flex-direction: column;
        }

        .grey-box {
            width: 150px;
            height: 150px;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            color: #fff;
            font-size: 3.5em;
            position: relative;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            width: 0.1em;
            height: 0.1em;
            border-radius: 50%;
            animation: moveDot 3s infinite;
        }

        @keyframes moveDot {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(140px, 0); }
            50% { transform: translate(140px, 140px); }
            75% { transform: translate(0, 140px); }
        }

        .grey-box:hover .dot {
            transform: scale(2.5);
        }

        .container {
            width: 150px;
            height: 150px;
            position: relative;
            overflow: hidden;
            border: 1px solid #fff;
        }

        .box {
            width: 25px;
            height: 25px;
            margin: 0;
            padding: 0;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
        }

        .box1, .box2, .box3 {
            background-image: url('https://th.bing.com/th/id/R.d968ea9c17cea392394660237dcafb60?rik=%2bcc8mtfA9quRdw&pid=ImgRaw&r=0');
        }

        .transparent-image {
            width: 233%;
            height: 233%;
            object-fit: cover;
            opacity: 0.9;
            filter: brightness(3.0);
            margin: 0;
            padding: 0;
            transform: scale(2.0);
        }

        .beaker {
            width: 50px;
            height: 100px;
            background: linear-gradient(to bottom, #00ff00, #ffffff);
            position: relative;
            margin: 20px 0;
        }

        .measurement {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 6px;
            color: #333;
        }

        .generator-button {
            margin: 15px 0;
            padding: 8px 16px;
            cursor: pointer;
        }

        /* ========== PERFECT YIN-YANG ========== */
        .yinyang {
            width: 60px;
            height: 60px;
            background: linear-gradient(to bottom, #ffffff 50%, #000000 50%);
            border-radius: 50%;
            position: relative;
            display: inline-block;
            margin: 10px;
            box-shadow: 0 0 12px rgba(255,255,255,0.4);
        }

        .yinyang::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 30px 0 #000000;
        }

        .yinyang::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: #000000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 -15px 0 #ffffff; /* white dot on black side */
        }
        /* ===================================== */

        .input-box {
            margin-top: 20px;
            text-align: center;
            color: white;
            position: relative;
        }
        
        .ai-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 255, 200, 0.1);
            border: 2px solid white;
            color: white;
            font-family: "Orbitron", sans-serif;
            box-shadow: 0 0 15px;
            backdrop-filter: blur(4px);
            min-height: 20px;
        }

        .three-boxes {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            position: absolute;
            right: 20px;
            top: 20px;
            gap: 10px;
        }

        canvas {
            display: block;          /* ← now visible */
            background: #111;
            margin: 20px auto;
            border: 1px solid #444;
        }

        .image-holder {
            width: 100px;
            height: 100px;
            border: 1px solid #ccc;
            margin-top: 10px;
            z-index: 1;
            position: relative;
            right: 0;
            background-image: url('https://www.bing.com/th/id/OGC.4286e6951be9f6eadf0f676f2ea7ec36?pid=1.7&rurl=https%3a%2f%2fmedia.giphy.com%2fmedia%2fLpp52J6KNZqhi%2fgiphy.gif&ehk=8uBILnCEppN5i%2fVy4ZACcYt9LEk1JKrbxnBxq3ikfQc%3d');
            background-size: cover;
            background-position: center;
            opacity: 0.5;
            filter: blur(2px);
        }
    </style>
</head>
<body>
    <div class="background" id="background"></div>
    
    <div class="main-container">
        <p style="color: white; margin: 20px 0 20px 80px;">
            For more details, please visit the <a href="visa.html" style="color:#0ff;">Visa Information</a> page.
        </p>

        <div class="container"></div>

        <div class="grey-box" id="jr-box">
            .jr.
        </div>

        <div class="box">
            <img src="https://s.yimg.com/ny/api/res/1.2/38.MSAcBO4Gl09ihioblnw--/YXBwaWQ9aGlnaGxhbmRlcjt3PTk2MDtoPTU0MA--/https://s.yimg.com/os/creatr-uploaded-images/2023-11/bd9a8200-81fe-11ee-887f-8ee2908ef0c1" 
                 alt="Image" class="transparent-image">
        </div>

        <!-- Visible canvas with Unicode yin-yang -->
        <canvas id="canvas" width="150" height="50"></canvas>
        
        <div id="楽" style="background-color: GhostWhite; border: 1px solid gray; padding: 15px; margin: 30px 0; border-radius: 8px;">
            TEXTEX
            <div style="display: flex; justify-content: center; align-items: center; margin-top: 12px; gap: 15px;">
                <div class="dot" style="position:static; width:8px; height:8px; background:#333;"></div>
                <div class="yinyang"></div>
            </div>
        </div>
    </div>

    <div class="beaker">
        <div class="measurement">1</div>
        <div class="measurement">5</div>
        <div class="measurement">10</div>
    </div>

    <!-- Standalone perfect yin-yang -->
    <div class="yinyang"></div>

    <svg height="50" width="150" style="margin: 20px 0;">
        <line x1="0" y1="25" x2="150" y2="25" stroke="red" stroke-width="3" />
    </svg>

    <button class="generator-button" onclick="getRandomOutcome()">Generate Outcome</button>
    <div id="output" style="margin: 10px 0; color: #0f0; font-size: 1.1em;"></div>
    
    <div class="input-box">
        <textarea id="text-input" placeholder="ALIEN.X" rows="4" cols="30"></textarea>
        <br><br>
        <button id="generate-btn">GENERATE OUTCOME</button>
        <div id="ai-response" class="ai-box"></div>
        <br>
        <input type="file" id="image-input" accept="image/*">
    </div>

    <div class="three-boxes">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="image-holder"></div>
    </div>

<script>
    // Background
    const backgroundImageUrl = 'https://i0.wp.com/cms.sofrep.com/wp-content/uploads/2022/07/2022-07-08-14.png?fit=1366%2C768&ssl=1';
    const backgroundDiv = document.getElementById('background');
    if (backgroundDiv) {
        backgroundDiv.style.backgroundImage = `url('${backgroundImageUrl}')`;
    }

    function getRandomColor() {
        const letters = '0123456789ABCDEF';
        let color = '#';
        for (let i = 0; i < 6; i++) {
            color += letters[Math.floor(Math.random() * 16)];
        }
        return color;
    }

    function createDot() {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.style.backgroundColor = getRandomColor();
        dot.style.top  = `${Math.random() * 140}px`;
        dot.style.left = `${Math.random() * 140}px`;

        const jrBox = document.getElementById('jr-box');
        if (jrBox) jrBox.appendChild(dot);
    }

    for (let i = 0; i < 15; i++) {
        createDot();
    }

    // Clickable
    const clickableWindow = document.getElementById("楽");
    if (clickableWindow) {
        clickableWindow.addEventListener("click", () => {
            window.open(".", "_blank");
        });
    }

    function getRandomIndex() {
        return Math.floor(Math.random() * 14);
    }

    function getRandomOutcome() {
        const outcomes = [
            "ASC|| call initiated.",
            "Index 1 selected.",
            "Index 2 chosen.",
            "Index 3 active.",
            "Index 4 locked.",
            "Index 5 open.",
            "Index 6 pulsing.",
            "Index 7 confirmed.",
            "Index 8 online.",
            "Index 9 standby.",
            "Index 10 ready.",
            "Index 11 engaged.",
            "Index 12 complete.",
            "Lucky number 13!"
        ];
        const outputEl = document.getElementById("output");
        if (outputEl) {
            outputEl.textContent = outcomes[getRandomIndex()];
        }
    }

    function draw() {
        const canvas = document.getElementById('canvas');
        if (!canvas || !canvas.getContext) return;

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Red line
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 3;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.beginPath();
        ctx.moveTo(centerX - 50, centerY);
        ctx.lineTo(centerX + 50, centerY);
        ctx.stroke();

        // Perfect Unicode yin-yang
        ctx.font = '28px Arial';
        ctx.fillStyle = '#0f0';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('☯', centerX, centerY);
    }

    draw();

    // GENERATE OUTCOME → redirect
    document.getElementById("generate-btn").addEventListener("click", function() {
        const aiBox = document.getElementById("ai-response");
        if (aiBox) aiBox.innerText = "Redirecting to ALIEN.X ...";
        setTimeout(() => {
            window.location.href = "https://jrxxyy.github.io/beta.html";
        }, 600);
    });
</script>
</body>
</html>
